apis:
- name: Axie Infinity Origins API
  description: >-
    Read-only REST API for Axie Infinity: Origins community game data — list and
    fetch cards, runes, charms and items; list a user's fighters and fighter
    configurations; read burned items; list seasons and season detail; read
    global and season leaderboards; and page through a user's battle logs.
    Served from the Sky Mavis API gateway under /origins/v2 and authenticated
    with an X-API-Key issued from the Ronin Developer Console.
  humanURL: https://docs.skymavis.com/api/origins/origins-endpoints
  baseURL: https://api-gateway.skymavis.com/origins/v2
  tags:
  - Gaming
  - Game Data
  - Leaderboards
  - Blockchain
  properties:
  - type: Authentication
    url: authentication/axie-infinity-authentication.yml
  - type: Conventions
    url: conventions/axie-infinity-conventions.yml
  - type: ErrorCatalog
    url: errors/axie-infinity-problem-types.yml
  - type: RateLimits
    url: rate-limits/axie-infinity-rate-limits.yml
- name: Axie Experience Points (AXP) API
  description: >-
    REST API for Axie Experience Points, the ecosystem-wide off-chain
    progression system for Axies. Partner games and dApps read AXP balances for
    up to 24 Axies at a time, read AXP by game, check AXP gained, and issue AXP
    to Axies with a batched update call keyed on game_id + axie_id + timestamp.
    Requires an app in the Ronin Developer Console plus an approved AXP service
    permission.
  humanURL: https://docs.skymavis.com/api/axp/axp-endpoints
  baseURL: https://api-gateway.skymavis.com/axp
  tags:
  - Gaming
  - Game Data
  - Blockchain
