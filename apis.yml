aid: axie-infinity
name: Axie Infinity
description: >-
  Axie Infinity is a blockchain game franchise built by Sky Mavis on the Ronin
  network, where players collect, breed and battle creatures called Axies across
  titles including Axie Infinity: Origins, Homeland and Classic. Its
  developer-facing surface is published through the Sky Mavis developer
  platform: the Axie Infinity Origins API exposes read-only community game data
  — cards, runes, charms, items, user fighter configurations, burned items,
  seasons, season leaderboards and paginated battle logs — while the Axie
  Experience Points (AXP) API lets partner games and dApps read and issue AXP,
  the off-chain progression token that maps to on-chain Axie levels. Both are
  REST products behind the api-gateway.skymavis.com gateway, authenticated with
  an X-API-Key issued per application from the Ronin Developer Console, and both
  require a per-service access grant requested in the console. Sky Mavis
  publishes a rendered API reference for these products but no downloadable
  OpenAPI description.
